<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3261F6" />
    </linearGradient>
  </defs>

  <!-- Gradient Background -->
  <rect width="64" height="64" rx="14" fill="url(#backgroundGradient)" />

  <!-- QR Code -->
  <g fill="#FFFFFF">
    <!-- Top-left finder -->
    <rect x="12" y="12" width="16" height="16" rx="2" />
    <rect x="16" y="16" width="8" height="8" rx="1" fill="#3261F6" />

    <!-- Top-right finder -->
    <rect x="36" y="12" width="16" height="16" rx="2" />
    <rect x="40" y="16" width="8" height="8" rx="1" fill="#3261F6" />

    <!-- Bottom-left finder -->
    <rect x="12" y="36" width="16" height="16" rx="2" />
    <rect x="16" y="40" width="8" height="8" rx="1" fill="#3261F6" />

    <!-- QR pattern -->
    <!-- <rect x="36" y="36" width="6" height="6" rx="1" /> -->
    <!-- <rect x="46" y="36" width="6" height="6" rx="1" /> -->
    <rect x="42" y="36" width="10" height="6" rx="1" />
    <rect x="36" y="46" width="6" height="6" rx="1" />
    <rect x="44" y="44" width="8" height="8" rx="1" />
    <!-- <rect x="32" y="52" width="6" height="4" rx="1" />
    <rect x="44" y="52" width="8" height="4" rx="1" /> -->
  </g>
</svg>